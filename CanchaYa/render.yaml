databases:
  - name: canchaya-db
    plan: free
    databaseName: canchaya
    user: canchaya

services:
  - type: web
    name: canchaya-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: canchaya-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
